<!DOCTYPE html>
<html lang="{{ ui_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ t('page_title_stats') }}</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Застосовує збережену тему СИНХРОННО, ДО завантаження style.css -
// без цього був би помітний "спалах" неправильної теми при кожному
// завантаженні сторінки (FOUC). Розташовано ПІСЛЯ <meta theme-color>
// (потрібен у DOM для querySelector) і ПЕРЕД <link rel="stylesheet">
// (щоб усе ще запобігати FOUC для CSS). try/catch - localStorage може
// бути недоступний (приватний режим деяких браузерів).
try {
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef2f8');
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="{{ static_v('style.css') }}">
<script>window.LANG = "{{ ui_lang }}"; window.I18N = {{ i18n_json | tojson }};</script>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <a href="/" class="settings-link" title="{{ t('back_to_dashboard') }}">←</a>
      <div>
        <h1>{{ t('nav_stats_title') }}</h1>
        <p>{{ t('stats_subtitle') }}</p>
      </div>
    </div>
    <img src="/static/logo.png" alt="logo" class="header-logo">
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2>{{ t('panel_event_log') }}</h2>
      <button class="clear-btn" id="clearEventsBtn" title="{{ t('btn_clear_title') }}">{{ t('btn_clear') }}</button>
    </div>
    <div class="log" id="eventLog">
      <div class="log-row"><span class="time">—</span><span class="kind">—</span><span>{{ t('loading') }}</span></div>
    </div>
  </div>

  <footer>
    {{ t('footer_license') }}
  </footer>
</div>

<script src="{{ static_v('common.js') }}"></script>
<script src="{{ static_v('stats.js') }}"></script>
<script src="{{ static_v('theme.js') }}"></script>
<script src="{{ static_v('pwa.js') }}"></script>
</body>
</html>

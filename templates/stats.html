<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Статистика — Dish Watch</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#0b1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Застосовує збережену тему СИНХРОННО, ДО завантаження style.css -
// без цього був би помітний "спалах" неправильної теми при кожному
// завантаженні сторінки (FOUC). Розташовано ПІСЛЯ <meta theme-color>
// (потрібен у DOM для querySelector) і ПЕРЕД <link rel="stylesheet">
// (щоб усе ще запобігати FOUC для CSS). try/catch - localStorage може
// бути недоступний (приватний режим деяких браузерів).
try {
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eef2f8');
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <a href="/" class="settings-link" title="Назад до дашборду">←</a>
      <div>
        <h1>Статистика</h1>
        <p>Dish Watch · журнал подій, результати speedtest</p>
      </div>
    </div>
    <img src="/static/logo.png" alt="logo" class="header-logo">
  </header>

  <div class="panel">
    <div class="panel-head">
      <h2>Тренди</h2>
      <div class="chart-period-select" id="chartPeriodSelect">
        <button data-hours="6" class="active">6г</button>
        <button data-hours="24">24г</button>
        <button data-hours="168">7д</button>
        <button data-hours="720">30д</button>
      </div>
    </div>
    <div class="chart-block">
      <div class="chart-label">Швидкість (Мбіт/с)</div>
      <canvas id="chartThroughput" height="120"></canvas>
    </div>
    <div class="chart-block">
      <div class="chart-label">Пінг (мс) / втрати пакетів (%)</div>
      <canvas id="chartPing" height="120"></canvas>
    </div>
    <div class="chart-block">
      <div class="chart-label">Перешкоди неба (%)</div>
      <canvas id="chartObstruction" height="120"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Журнал подій</h2>
      <button class="clear-btn" id="clearEventsBtn" title="Очистити журнал подій">Очистити</button>
    </div>
    <div class="log" id="eventLog">
      <div class="log-row"><span class="time">—</span><span class="kind">—</span><span>Завантаження...</span></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Результати заміру швидкості</h2>
      <span class="sub" id="speedtestSub"></span>
    </div>
    <div class="log" id="speedtestLog">
      <div class="log-row"><span class="time">—</span><span class="kind">—</span><span>Завантаження...</span></div>
    </div>
  </div>

  <footer>
    © 2026 JunioR · Starlink Mini Monitor · Ліцензія MIT
  </footer>
</div>

<script src="{{ static_v('common.js') }}"></script>
<script src="{{ static_v('stats.js') }}"></script>
<script src="{{ static_v('theme.js') }}"></script>
<script src="{{ static_v('pwa.js') }}"></script>
</body>
</html>

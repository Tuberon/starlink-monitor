[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
# глобальний прапорець (у per-module секціях недопустимий)
warn_redundant_casts = True
disallow_untyped_defs = False
no_implicit_optional = True

# СУВОРИЙ режим для коду застосунку (app/*): еквівалент `mypy --strict`, але
# лише тут - у tests/ типізація свідомо м'яка. `strict` у per-module секції
# недоступний, тому прапорці розгорнуто. Раніше було 11 помилок, усі виправлені
# без зміни поведінки (анотації й три "return Any"); тепер нова функція без
# анотацій чи "return Any" не пройде `mypy app/ tests/`.
[mypy-app.*]
check_untyped_defs = True
disallow_subclassing_any = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
extra_checks = True
no_implicit_reexport = True
strict_equality = True
warn_return_any = True
warn_unused_ignores = True

# Сторонній код (sparky8512/starlink-grpc-tools), не наш - типізацію
# і будь-які помилки в ньому свідомо ігноруємо. Див.
# docs/decisions-log.md: "starlink_grpc.py винесено як vendor-файл".
[mypy-app.vendor.*]
ignore_errors = True

# Hardware-специфічні залежності Raspberry Pi - недоступні поза
# реальним пристроєм (SPI/GPIO), встановлюються лише через
# requirements.txt на самому Pi, тому в будь-якому іншому середовищі
# (напр. цей sandbox) відсутні py.typed-маркери чи stub-пакети.
[mypy-gpiod.*]
ignore_missing_imports = True
[mypy-board]
ignore_missing_imports = True
[mypy-digitalio]
ignore_missing_imports = True
[mypy-busio]
ignore_missing_imports = True
[mypy-adafruit_rgb_display.*]
ignore_missing_imports = True

# requests, psutil, dns (dnspython) типізовано СПРАВЖНІМИ стабами (types-requests,
# types-psutil у requirements-dev.txt; dnspython постачає py.typed) - виклики
# цих бібліотек перевіряються (перевірено мутацією: timeout="десять" у
# session.request ловиться як arg-type). Раніше тут стояли ignore_missing_imports,
# тобто ці виклики не перевірялись взагалі. Не додавайте ignore_missing_imports
# для нових pip-пакетів - додайте types-* у requirements-dev.txt; виняток -
# лише апаратні бібліотеки Pi вище (тест test_mypy_config_stays_strict).

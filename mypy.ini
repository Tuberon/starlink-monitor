[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
no_implicit_optional = True

# Сторонній код (sparky8512/starlink-grpc-tools), не наш - типізацію
# і будь-які помилки в ньому свідомо ігноруємо. Див.
# docs/decisions-log.md: "starlink_grpc.py винесено як vendor-файл".
[mypy-app.vendor.*]
ignore_errors = True

# Hardware-специфічні залежності Raspberry Pi - недоступні поза
# реальним пристроєм (SPI/GPIO), встановлюються лише через
# requirements.txt на самому Pi, тому в будь-якому іншому середовищі
# (напр. цей sandbox) відсутні py.typed-маркери чи stub-пакети.
[mypy-gpiod.*]
ignore_missing_imports = True
[mypy-board]
ignore_missing_imports = True
[mypy-digitalio]
ignore_missing_imports = True
[mypy-busio]
ignore_missing_imports = True
[mypy-adafruit_rgb_display.*]
ignore_missing_imports = True

# Сторонні pip-пакети без офіційних type stubs (types-* пакети не
# встановлені - non-strict підхід, не гонимось за 100% покриттям
# третьосторонніх бібліотек, лише свій код).
[mypy-speedtest]
ignore_missing_imports = True
[mypy-dns.*]
ignore_missing_imports = True
[mypy-requests.*]
ignore_missing_imports = True
[mypy-psutil]
ignore_missing_imports = True
